<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D47A1">
<title>Exam · Prepositions</title>
<style>
:root{--p:#0D47A1;--s:#2e7d32;--e:#c62828;--bg:#f0f4f8;--c:#fff;--t:#1a1a1a;--m:#666;--b:#d0d8e0;--w:#f9a825}
[data-theme=dark]{--p:#64B5F6;--s:#66bb6a;--e:#ef5350;--bg:#0f1419;--c:#1a222d;--t:#e8eaed;--m:#9aa0a6;--b:#2d3744;--w:#ffb300}
*{box-sizing:border-box;margin:0;padding:0}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.45;padding-bottom:80px}
header{background:linear-gradient(135deg,#0D47A1,#1565C0);color:#fff;padding:16px 12px;text-align:center;position:sticky;top:0;z-index:30}
header h1{font-size:1.25rem}header p{opacity:.9;font-size:.78rem}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;color:var(--p);margin-bottom:8px}
.hint{font-size:.78rem;color:var(--m);margin-bottom:10px}
label{display:block;font-size:.85rem;margin-bottom:4px;font-weight:600}
input[type=text]{width:100%;padding:10px;border:2px solid var(--b);border-radius:8px;background:var(--c);font-size:1rem;margin-bottom:10px}
.btn{padding:10px 16px;border:none;border-radius:8px;background:var(--p);color:#fff;font-weight:600;font-size:.9rem;margin:4px 2px}
.btn.sec{background:var(--c);color:var(--p);border:2px solid var(--b)}
.btn:disabled{opacity:.5}
.sec-title{background:var(--p);color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;font-size:.9rem;margin:16px 0 10px}
.q{font-weight:600;margin-bottom:7px;font-size:.92rem}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{padding:11px 12px;border:2px solid var(--b);border-radius:8px;background:var(--c);text-align:left;font-size:.88rem}
.opt.sel{border-color:var(--p);background:rgba(13,71,161,.1)}
.opt.ok{border-color:var(--s);background:rgba(46,125,50,.12);color:var(--s)}
.opt.bad{border-color:var(--e);background:rgba(198,40,40,.12);color:var(--e)}
.gap input{width:100%;max-width:180px;padding:9px;border:2px solid var(--b);border-radius:7px;text-align:center;font-weight:600;background:var(--c)}
.fb{font-size:.78rem;margin-top:4px}.fb.ok{color:var(--s)}.fb.bad{color:var(--e)}
.score-big{text-align:center;font-size:1.4rem;font-weight:800;margin:12px 0}
.pass{color:var(--s)}.fail{color:var(--e)}
.bar{height:10px;background:var(--b);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar>div{height:100%;background:var(--p)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:700;background:var(--bg);color:var(--p)}
table{width:100%;border-collapse:collapse;font-size:.8rem}
td,th{border:1px solid var(--b);padding:6px;text-align:left}th{background:var(--bg)}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Exam · Prepositions</h1>
  <p>Time · Place · Direction · Transport</p>
  <button type="button" style="margin-top:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 12px;border-radius:16px;font-size:.75rem" onclick="(function(d){d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'':'dark')})(document.documentElement)">🌓</button>
</header>
<div class="wrap">
<div id="startScreen" class="card">
  <h2>Регистрация на экзамен</h2>
  <p class="hint">40 заданий · проходной 70%. После сдачи ответ сохраняется и скачивается.</p>
  <label>Имя и фамилия *</label>
  <input type="text" id="stuName" placeholder="Иван Иванов" autocomplete="name">
  <label>Группа / класс</label>
  <input type="text" id="stuGroup" placeholder="A2">
  <button class="btn" onclick="startExam()">Начать экзамен</button>
  <button class="btn sec" onclick="showTeacher()">Кабинет преподавателя</button>
</div>
<div id="examScreen" class="hidden">
  <div class="card" style="padding:10px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
      <span id="stuLabel" style="font-weight:600;font-size:.9rem"></span>
      <span class="badge" id="progBadge">0 / 40</span>
    </div>
    <div class="bar"><div id="progBar" style="width:0%"></div></div>
  </div>
  <div id="examBody"></div>
  <div class="nav">
    <button class="btn sec" id="btnPrev" onclick="nav(-1)">← Назад</button>
    <button class="btn" id="btnNext" onclick="nav(1)">Далее →</button>
  </div>
  <div class="card" style="margin-top:12px">
    <button class="btn" style="width:100%" onclick="submitExam()">Сдать экзамен</button>
  </div>
</div>
<div id="resultScreen" class="hidden">
  <div class="card">
    <h2>Результат</h2>
    <div class="score-big" id="scoreBig"></div>
    <div id="scoreDetail" class="hint"></div>
    <div id="bySection"></div>
    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px">
      <button class="btn" onclick="downloadJSON()">⬇ JSON</button>
      <button class="btn sec" onclick="downloadCSV()">⬇ CSV</button>
      <button class="btn sec" onclick="copySummary()">📋 Копировать итог</button>
    </div>
    <button class="btn sec" onclick="location.reload()">Новый респондент</button>
  </div>
  <div class="card"><h2>Разбор</h2><div id="reviewList"></div></div>
</div>
<div id="teacherScreen" class="hidden">
  <div class="card">
    <h2>Кабинет преподавателя</h2>
    <p class="hint">Сдачи в этом браузере. С телефонов учеников — JSON/CSV.</p>
    <div id="teacherList"></div>
    <button class="btn sec" onclick="exportAll()">⬇ Все JSON</button>
    <button class="btn sec" onclick="clearAll()">🗑 Очистить</button>
    <button class="btn sec" onclick="location.reload()">← Назад</button>
  </div>
</div>
</div>
<script>
const ITEMS=[
{id:1,sec:"Time",type:"mcq",q:"The train leaves ___ 8.30.",o:["at","in","on","by"],a:0,c:"Точное время → at"},
{id:2,sec:"Time",type:"mcq",q:"We usually travel ___ summer.",o:["in","on","at","for"],a:0,c:"in"},
{id:3,sec:"Time",type:"mcq",q:"The meeting is ___ Friday.",o:["on","in","at","by"],a:0,c:"on"},
{id:4,sec:"Time",type:"mcq",q:"I have lived here ___ 2019.",o:["since","for","from","by"],a:0,c:"since"},
{id:5,sec:"Time",type:"mcq",q:"Finish the report ___ Friday.",o:["by","until","since","in"],a:0,c:"by"},
{id:6,sec:"Time",type:"gap",q:"I’ll call you ___ ten minutes.",a:["in"],c:"in"},
{id:7,sec:"Time",type:"gap",q:"She waited ___ 8 p.m.",a:["until","till"],c:"until"},
{id:8,sec:"Time",type:"gap",q:"I studied English ___ three years.",a:["for"],c:"for"},
{id:9,sec:"Time",type:"err",q:"Выбери правильный:",o:["I saw him last Monday.","I saw him on last Monday.","I saw him in last Monday."],a:0,c:"last → без"},
{id:10,sec:"Time",type:"mcq",q:"He came ___ time (точно).",o:["on","in","at","by"],a:0,c:"on time"},
{id:11,sec:"Place",type:"mcq",q:"The keys are ___ the table.",o:["on","in","at","under"],a:0,c:"on"},
{id:12,sec:"Place",type:"mcq",q:"She is ___ the kitchen.",o:["in","on","at","by"],a:0,c:"in"},
{id:13,sec:"Place",type:"mcq",q:"Meet you ___ the station.",o:["at","in","on","to"],a:0,c:"at"},
{id:14,sec:"Place",type:"mcq",q:"The shop is ___ the bank and the café.",o:["between","among","next to","opposite"],a:0,c:"between"},
{id:15,sec:"Place",type:"mcq",q:"Trees ___ the forest.",o:["among","between","next to","opposite"],a:0,c:"among"},
{id:16,sec:"Place",type:"gap",q:"The cat is ___ the bed.",a:["under"],c:"under"},
{id:17,sec:"Place",type:"gap",q:"Sit ___ me.",a:["next to","beside","by"],c:"next to"},
{id:18,sec:"Place",type:"gap",q:"The bank is ___ the post office.",a:["opposite"],c:"opposite"},
{id:19,sec:"Place",type:"err",q:"Выбери правильный:",o:["I am at home.","I am in home.","I am on home."],a:0,c:"at home"},
{id:20,sec:"Place",type:"mcq",q:"Lamp ___ the corner of the room.",o:["in","at","on","by"],a:0,c:"in the corner"},
{id:21,sec:"Direction",type:"mcq",q:"He walked ___ the window.",o:["to","at","in","on"],a:0,c:"to"},
{id:22,sec:"Direction",type:"mcq",q:"She ran ___ the room.",o:["into","in","to","onto"],a:0,c:"into"},
{id:23,sec:"Direction",type:"mcq",q:"Take the book ___ the shelf.",o:["off","out of","from","of"],a:0,c:"off"},
{id:24,sec:"Direction",type:"mcq",q:"Letter ___ my pocket.",o:["out of","off","from","of"],a:0,c:"out of"},
{id:25,sec:"Direction",type:"mcq",q:"Swim ___ the river.",o:["across","through","over","into"],a:0,c:"across"},
{id:26,sec:"Direction",type:"gap",q:"We drove ___ the forest.",a:["through"],c:"through"},
{id:27,sec:"Direction",type:"gap",q:"Go ___ the bridge.",a:["over","across"],c:"over/across"},
{id:28,sec:"Direction",type:"gap",q:"I’m going ___ (домой).",a:["home"],c:"home без to"},
{id:29,sec:"Direction",type:"err",q:"Выбери правильный:",o:["I’m going home.","I’m going to home.","I’m going at home."],a:0,c:"home"},
{id:30,sec:"Direction",type:"mcq",q:"She walked ___ the door.",o:["towards","into","at","on"],a:0,c:"towards"},
{id:31,sec:"Transport",type:"mcq",q:"I go to work ___ bus.",o:["by","on","in","with"],a:0,c:"by"},
{id:32,sec:"Transport",type:"mcq",q:"I’m sitting ___ the bus.",o:["on","in","by","at"],a:0,c:"on"},
{id:33,sec:"Transport",type:"mcq",q:"She is ___ the car.",o:["in","on","by","at"],a:0,c:"in"},
{id:34,sec:"Transport",type:"mcq",q:"We got ___ the train.",o:["on","in","into","by"],a:0,c:"get on"},
{id:35,sec:"Transport",type:"mcq",q:"Get ___ the car!",o:["in","on","into","by"],a:0,c:"get in"},
{id:36,sec:"Transport",type:"gap",q:"She goes ___ foot.",a:["on"],c:"on foot"},
{id:37,sec:"Transport",type:"gap",q:"They arrived ___ Paris.",a:["in"],c:"arrive in"},
{id:38,sec:"Transport",type:"gap",q:"He arrived ___ the airport.",a:["at"],c:"arrive at"},
{id:39,sec:"Transport",type:"err",q:"Выбери правильный:",o:["I go to work by bus every day.","I go to work in bus every day.","I go to work with bus every day."],a:0,c:"by bus"},
{id:40,sec:"Transport",type:"mcq",q:"We are leaving ___ London tomorrow.",o:["for","to","in","at"],a:0,c:"leave for"}
];
ITEMS.forEach(it=>{if((it.type==="mcq"||it.type==="err")&&it.o){const c=it.o[it.a],o=it.o.slice();for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}it.o=o;it.a=o.indexOf(c)}});
const STORE="prepositions_exam_v1";
let student={name:"",group:""},answers={},page=0,PAGE_SIZE=5,pages=Math.ceil(ITEMS.length/PAGE_SIZE),submitted=false,lastResult=null;
function startExam(){const name=(document.getElementById("stuName").value||"").trim();if(!name){alert("Введите имя");return}student={name,group:(document.getElementById("stuGroup").value||"").trim()};document.getElementById("startScreen").classList.add("hidden");document.getElementById("examScreen").classList.remove("hidden");document.getElementById("stuLabel").textContent=student.name+(student.group?" · "+student.group:"");page=0;answers={};submitted=false;renderPage()}
function renderPage(){const start=page*PAGE_SIZE,slice=ITEMS.slice(start,start+PAGE_SIZE);let html="",cur="";slice.forEach((it,idx)=>{if(it.sec!==cur){cur=it.sec;html+=`<div class="sec-title">${secLabel(it.sec)}</div>`}html+=renderItem(it,start+idx)});document.getElementById("examBody").innerHTML=html;document.getElementById("btnPrev").disabled=page===0;document.getElementById("btnNext").disabled=page>=pages-1;updateProg();slice.forEach(it=>{const ans=answers[it.id];if(ans==null)return;if(it.type==="mcq"||it.type==="err"){const btns=document.querySelectorAll(`[data-qid="${it.id}"] .opt`);if(btns[ans.choice])btns[ans.choice].classList.add("sel")}else{const inp=document.getElementById("gap"+it.id);if(inp)inp.value=ans.text||""}})}
function secLabel(s){return{Time:"⏰ Time",Place:"📍 Place",Direction:"➡️ Direction",Transport:"🚌 Transport"}[s]||s}
function renderItem(it,num){let body="";if(it.type==="mcq"||it.type==="err")body=`<div class="opts" data-qid="${it.id}">${it.o.map((o,j)=>`<button type="button" class="opt" onclick="pick(${it.id},${j})">${o}</button>`).join("")}</div>`;else body=`<div class="gap"><input id="gap${it.id}" type="text" autocomplete="off" placeholder="предлог" oninput="typeAns(${it.id},this.value)"></div>`;return `<div class="card"><div class="q">${num+1}. ${it.q}</div>${body}</div>`}
function pick(id,j){if(submitted)return;answers[id]={choice:j};document.querySelectorAll(`[data-qid="${id}"] .opt`).forEach((b,i)=>b.classList.toggle("sel",i===j));updateProg()}
function typeAns(id,v){if(submitted)return;answers[id]={text:(v||"").trim()};updateProg()}
function updateProg(){const n=Object.keys(answers).filter(k=>{const a=answers[k];return a&&((a.choice!=null)||(a.text&&a.text.length))}).length;document.getElementById("progBadge").textContent=n+" / "+ITEMS.length;document.getElementById("progBar").style.width=(100*n/ITEMS.length)+"%"}
function nav(d){saveGaps();page=Math.max(0,Math.min(pages-1,page+d));renderPage();window.scrollTo(0,0)}
function saveGaps(){ITEMS.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE).forEach(it=>{if(it.type==="gap"){const inp=document.getElementById("gap"+it.id);if(inp)answers[it.id]={text:inp.value.trim()}}})}
function isCorrect(it,ans){if(!ans)return false;if(it.type==="mcq"||it.type==="err")return ans.choice===it.a;if(it.type==="gap"){const v=(ans.text||"").toLowerCase().replace(/\s+/g," ");return(it.a||[]).some(x=>x.toLowerCase()===v)}return false}
function submitExam(){saveGaps();const answered=Object.keys(answers).filter(k=>{const a=answers[k];return a&&((a.choice!=null)||(a.text&&a.text.length))}).length;if(answered<ITEMS.length&&!confirm("Отвечено "+answered+" из "+ITEMS.length+". Сдать?"))return;if(!confirm("Сдать экзамен?"))return;let correct=0;const bySec={},details=[];ITEMS.forEach(it=>{const ok=isCorrect(it,answers[it.id]);if(ok)correct++;if(!bySec[it.sec])bySec[it.sec]={c:0,t:0};bySec[it.sec].t++;if(ok)bySec[it.sec].c++;let studentAns="—";if(answers[it.id]){if(it.type==="gap")studentAns=answers[it.id].text||"—";else studentAns=it.o[answers[it.id].choice]||"—"}const right=it.type==="gap"?it.a.join(" / "):it.o[it.a];details.push({id:it.id,sec:it.sec,q:it.q,studentAns,right,ok,c:it.c})});const pct=Math.round(100*correct/ITEMS.length),pass=pct>=70;const result={id:Date.now()+"_"+Math.random().toString(36).slice(2,7),name:student.name,group:student.group,date:new Date().toISOString(),dateLocal:new Date().toLocaleString("ru-RU"),correct,total:ITEMS.length,pct,pass,bySec,details,answers};lastResult=result;saveSubmission(result);showResult(result)}
function saveSubmission(result){const all=loadAll();all.push({id:result.id,name:result.name,group:result.group,date:result.date,dateLocal:result.dateLocal,correct:result.correct,total:result.total,pct:result.pct,pass:result.pass,bySec:result.bySec,details:result.details});localStorage.setItem(STORE,JSON.stringify(all))}
function loadAll(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function showResult(r){submitted=true;document.getElementById("examScreen").classList.add("hidden");document.getElementById("resultScreen").classList.remove("hidden");const el=document.getElementById("scoreBig");el.className="score-big "+(r.pass?"pass":"fail");el.textContent=r.pct+"% · "+r.correct+" / "+r.total+(r.pass?" · Сдано ✓":" · Не сдано");document.getElementById("scoreDetail").textContent=r.name+(r.group?" · "+r.group:"")+" · "+r.dateLocal;let secHtml="<table><tr><th>Раздел</th><th>Балл</th></tr>";Object.keys(r.bySec).forEach(s=>{const x=r.bySec[s];secHtml+=`<tr><td>${s}</td><td>${x.c}/${x.t} (${Math.round(100*x.c/x.t)}%)</td></tr>`});document.getElementById("bySection").innerHTML=secHtml+"</table>";document.getElementById("reviewList").innerHTML=r.details.map(d=>`<div style="padding:8px 0;border-bottom:1px solid var(--b);font-size:.85rem"><b>${d.id}.</b> [${d.sec}] ${d.q}<br>Ваш: <span class="${d.ok?"fb ok":"fb bad"}">${escapeHtml(d.studentAns)}</span>${d.ok?"":" · Верно: <b>"+escapeHtml(d.right)+"</b>"}<div class="hint">${d.c||""}</div></div>`).join("");window.scrollTo(0,0)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function downloadJSON(){if(!lastResult)return;const blob=new Blob([JSON.stringify(lastResult,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`exam_${lastResult.name.replace(/\s+/g,"_")}_${lastResult.pct}.json`;a.click()}
function downloadCSV(){if(!lastResult)return;let rows=[["id","section","question","student","correct","ok","comment"]];lastResult.details.forEach(d=>rows.push([d.id,d.sec,d.q,d.studentAns,d.right,d.ok?"1":"0",d.c||""]));const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`exam_${lastResult.name.replace(/\s+/g,"_")}.csv`;a.click()}
function copySummary(){if(!lastResult)return;const r=lastResult;const t=`Экзамен Prepositions\n${r.name}${r.group?" · "+r.group:""}\n${r.dateLocal}\n${r.pct}% (${r.correct}/${r.total}) ${r.pass?"СДАНО":"НЕ СДАНО"}\n`+Object.keys(r.bySec).map(s=>`${s}: ${r.bySec[s].c}/${r.bySec[s].t}`).join("\n");navigator.clipboard.writeText(t).then(()=>alert("Скопировано")).catch(()=>prompt("Скопируйте:",t))}
function showTeacher(){document.getElementById("startScreen").classList.add("hidden");document.getElementById("teacherScreen").classList.remove("hidden");const all=loadAll().slice().reverse();const box=document.getElementById("teacherList");if(!all.length){box.innerHTML="<p class='hint'>Нет сдач в этом браузере.</p>";return}box.innerHTML="<table><tr><th>Дата</th><th>Имя</th><th>%</th><th></th></tr>"+all.map((r,i)=>`<tr><td>${r.dateLocal||r.date}</td><td>${escapeHtml(r.name)}</td><td>${r.pct}%</td><td><button class="btn sec" style="padding:4px 8px;font-size:.75rem;margin:0" onclick="viewSub(${all.length-1-i})">Открыть</button></td></tr>`).join("")+"</table>"}
function viewSub(idx){const r=loadAll()[idx];if(!r)return;lastResult=r;document.getElementById("teacherScreen").classList.add("hidden");showResult(r)}
function exportAll(){const blob=new Blob([JSON.stringify(loadAll(),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="prepositions_exam_all.json";a.click()}
function clearAll(){if(!confirm("Удалить все сдачи?"))return;localStorage.removeItem(STORE);showTeacher()}
</script>
</body>
</html>
